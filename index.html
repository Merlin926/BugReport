const byId=(id)=>document.getElementById(id);
const make=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const statusOrder={"待办":0,"进行中":1,"暂停":2,"评审中":3,"完成":4};
function renderKpis(id,tiles,cardClass="kpi"){const root=byId(id);root.replaceChildren();tiles.forEach((tile)=>{const card=make("div",cardClass+" "+tile.kind);card.append(make("div","kpi-label",tile.label),make("div","kpi-value",tile.value));root.append(card)})}
function renderSummary(){const s=MODEL.summary;renderKpis("backlogPrimaryKpis",[{label:"当前BUG数量",value:s.currentOpen+" 条",kind:"weekend"}]);const breakdown=make("div","priority-breakdown");["MustNow","Must","Should","Could"].forEach((priority)=>{const count=MODEL.issues.filter((issue)=>issue.isOpen&&issue.priority===priority).length;const stat=make("button","priority-stat");stat.type="button";stat.setAttribute("aria-label",priority+" 当前未完成 Bug "+count+" 条，点击查看明细");stat.append(make("span","priority-name",priority),make("span","priority-count",count+" 条"));stat.addEventListener("click",()=>openPriorityDetail(priority));breakdown.append(stat)});byId("backlogPrimaryKpis").firstElementChild.append(breakdown);renderKpis("previousPrimaryKpis",[{label:"上周BUG数量",value:"",kind:"previous"}]);renderKpis("flowKpis",[{label:"本周新增",value:s.newCount+" 条",kind:"new"},{label:"本周解决",value:s.resolved+" 条",kind:"solved"}])}
function ledgerHalf(module,type,count,kind,label,maxValue,side){const percent=count/maxValue*100;const button=make("button","ledger-half "+side+" "+kind+(percent>72?" inside":""));button.type="button";button.disabled=count===0;button.style.setProperty("--bar-pct",percent+"%");button.setAttribute("aria-label",module+" "+label+" "+count+" 条");if(count){button.append(make("span","ledger-bar"));button.addEventListener("click",()=>openDetail(module,type,label))}button.append(make("span","ledger-num",String(count)));return button}
function renderFlow(){const root=byId("flowRows");root.replaceChildren();const rows=MODEL.modules.filter((row)=>row.newCount||row.resolved).map((row)=>({...row,netChange:row.resolved-row.newCount})).sort((a,b)=>b.netChange-a.netChange||b.resolved-a.resolved||a.newCount-b.newCount||a.module.localeCompare(b.module,"zh-CN"));const maxValue=Math.max(...rows.flatMap((row)=>[row.newCount,row.resolved]),1);rows.forEach((row)=>{const line=make("div","flow-row"),name=make("div","module-name",row.module),ledger=make("div","ledger-axis");name.title=row.module;ledger.append(ledgerHalf(row.module,"resolved",row.resolved,"solved","本周解决",maxValue,"left"),ledgerHalf(row.module,"new",row.newCount,"new","本周新增",maxValue,"right"));const result=row.netChange>0?make("span","net-result positive","净减少 "+row.netChange+" 条"):row.netChange<0?make("span","net-result negative","净增加 "+Math.abs(row.netChange)+" 条"):make("span","net-result neutral","持平");line.append(name,ledger,result);root.append(line)})}
function renderBacklog(){const root=byId("backlogRows");root.replaceChildren();const rows=MODEL.modules.filter((row)=>row.currentOpen>0).sort((a,b)=>b.currentOpen-a.currentOpen||b.longLeft-a.longLeft||a.module.localeCompare(b.module,"zh-CN"));const maxOpen=Math.max(...rows.map((row)=>row.currentOpen),1);rows.forEach((row)=>{const line=make("div","backlog-row"),name=make("div","module-name",row.module),track=make("div","backlog-track");name.title=row.module;if(row.weekLeft){const segment=make("button","seg-btn week",String(row.weekLeft));segment.type="button";segment.style.width=row.weekLeft/maxOpen*100+"%";segment.setAttribute("aria-label",row.module+" 本周遗留 "+row.weekLeft+" 条");segment.addEventListener("click",()=>openDetail(row.module,"week","本周遗留"));track.append(segment)}if(row.longLeft){const segment=make("button","seg-btn long",String(row.longLeft));segment.type="button";segment.style.width=row.longLeft/maxOpen*100+"%";segment.setAttribute("aria-label",row.module+" 长期遗留 "+row.longLeft+" 条");segment.addEventListener("click",()=>openDetail(row.module,"long","长期遗留"));track.append(segment)}const total=make("button","total-btn",row.currentOpen+" 条");total.type="button";total.addEventListener("click",()=>openDetail(row.module,"open","当前遗留"));line.append(name,track,total);root.append(line)})}
function renderShare(){const root=byId("shareRows");root.replaceChildren();MODEL.modules.filter((row)=>row.currentOpen>0).sort((a,b)=>b.currentOpen-a.currentOpen||a.module.localeCompare(b.module,"zh-CN")).forEach((row)=>{const button=make("button","share-row"),name=make("span","module-name",row.module),track=make("span","share-track"),fill=make("span","share-fill"),value=make("span","share-value",row.currentOpen+" 条 · "+row.share+"%");button.type="button";button.setAttribute("aria-label",row.module+" 当前遗留 "+row.currentOpen+" 条，占比 "+row.share+"%");fill.style.width=Math.max(row.share,1)+"%";track.append(fill);button.append(name,track,value);button.addEventListener("click",()=>openDetail(row.module,"open","当前遗留"));root.append(button)})}
function matches(issue,module,type){if(issue.module!==module)return false;if(type==="new")return issue.isNew;if(type==="resolved")return issue.isResolved;if(type==="week")return issue.isOpen&&issue.leftKind==="week";if(type==="long")return issue.isOpen&&issue.leftKind==="long";return issue.isOpen}
let detailReturnFocus=null;
function showDetail(rows,title,subtitle){byId("detailTitle").textContent=title+"（"+rows.length+" 条）";byId("detailSub").textContent=subtitle;const list=byId("detailList");list.replaceChildren();if(!rows.length)list.append(make("div","detail-empty","暂无 Bug"));const grouped=[...new Set(rows.map((issue)=>issue.module))].map((module)=>({module,issues:rows.filter((issue)=>issue.module===module)})).sort((a,b)=>b.issues.length-a.issues.length||a.module.localeCompare(b.module,"zh-CN"));grouped.forEach((entry)=>{const group=make("section","detail-group"),head=make("div","detail-group-head"),groupRows=make("div","detail-group-rows");head.append(make("span","detail-group-name",entry.module),make("span","detail-group-count",entry.issues.length+" 条"));entry.issues.forEach((issue)=>{const row=make("div","detail-row");row.append(make("span","detail-key",issue.key),make("span","detail-status",issue.status),make("span","detail-summary",issue.summary),make("span","detail-assignee",issue.assignee||"—"),make("span","detail-date",issue.createdAt||"日期缺失"));groupRows.append(row)});group.append(head,groupRows);list.append(group)});detailReturnFocus=document.activeElement;const panel=byId("detail");panel.hidden=false;document.body.classList.add("detail-open");byId("detailClose").focus({preventScroll:true})}
function openPriorityDetail(priority){const rows=MODEL.issues.filter((issue)=>issue.isOpen&&issue.priority===priority).sort((a,b)=>statusOrder[a.status]-statusOrder[b.status]||a.key.localeCompare(b.key));showDetail(rows,priority+" · 当前 BUG","显示该优先级下当前未完成的 Bug")}
function openDetail(module,type,label){const rows=MODEL.issues.filter((issue)=>matches(issue,module,type)).sort((a,b)=>statusOrder[a.status]-statusOrder[b.status]||a.key.localeCompare(b.key));showDetail(rows,module+" · "+label,"显示周五最新状态和负责人")}
function closeDetail(){const panel=byId("detail");if(panel.hidden)return;panel.hidden=true;document.body.classList.remove("detail-open");if(detailReturnFocus&&document.contains(detailReturnFocus))detailReturnFocus.focus({preventScroll:true})}
byId("detailClose").addEventListener("click",closeDetail);byId("detail").addEventListener("click",(event)=>{if(event.target===event.currentTarget)closeDetail()});addEventListener("keydown",(event)=>{if(event.key==="Escape")closeDetail()});renderSummary();renderBacklog();renderShare();renderFlow();
</script>
</body>
</html>
