<script>
"use strict";
const MODEL=JSON.parse(document.getElementById("report-data").textContent);
const el=(id)=>document.getElementById(id);
const make=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const statusOrder={"待办":0,"进行中":1,"暂停":2,"评审中":3};
const statusColors={"待办":"var(--s1)","进行中":"var(--s2)","暂停":"var(--s3)","评审中":"var(--s4)"};
let detailReturnFocus=null;

function matchingIssues(filters){return MODEL.issues.filter((issue)=>Object.entries(filters).every(([key,value])=>issue[key]===value)).sort((a,b)=>(statusOrder[a.status]??9)-(statusOrder[b.status]??9)||a.priority.localeCompare(b.priority)||a.key.localeCompare(b.key))}
function openDetail(filters,title,subtitle){showDetail(matchingIssues(filters),title,subtitle)}
function showDetail(rows,title,subtitle){
  el("detailTitle").textContent=title+"（"+rows.length+" 条）";el("detailSub").textContent=subtitle;const list=el("detailList");list.replaceChildren();if(!rows.length)list.append(make("div","detail-empty","暂无 Bug"));
  const groups=[...new Set(rows.map((issue)=>issue.module))].map((module)=>({module,issues:rows.filter((issue)=>issue.module===module)})).sort((a,b)=>b.issues.length-a.issues.length||a.module.localeCompare(b.module,"zh-CN"));
  groups.forEach((entry)=>{const group=make("section","detail-group"),head=make("div","detail-group-head"),body=make("div","detail-group-rows");head.append(make("span","detail-group-name",entry.module),make("span","detail-group-count",entry.issues.length+" 条"));entry.issues.forEach((issue)=>{const row=make("div","detail-row");row.append(make("span","detail-key",issue.key),make("span","detail-priority",issue.priority),make("span","detail-status",issue.status),make("span","detail-assignee",issue.assignee),make("span","detail-date",issue.createdAt),make("span","detail-summary",issue.summary));body.append(row)});group.append(head,body);list.append(group)});
  detailReturnFocus=document.activeElement;el("detail").hidden=false;document.body.classList.add("detail-open");el("detailClose").focus({preventScroll:true});
}
function closeDetail(){const detail=el("detail");if(detail.hidden)return;detail.hidden=true;document.body.classList.remove("detail-open");if(detailReturnFocus&&document.contains(detailReturnFocus))detailReturnFocus.focus({preventScroll:true})}

function renderStatuses(){const root=el("statusGrid");root.replaceChildren();MODEL.summary.statuses.forEach((item)=>{const button=make("button","status-tile");button.type="button";button.setAttribute("aria-label",item.status+" "+item.count+" 条，点击查看明细");const name=make("span","status-name"),dot=make("i","status-dot");dot.style.background=statusColors[item.status];name.append(dot,document.createTextNode(item.status));const count=make("span","status-count",String(item.count));count.append(make("span","status-unit","条"));button.append(name,count);button.addEventListener("click",()=>openDetail({status:item.status},item.status,"当前未完成 Bug"));root.append(button)})}

function renderPriorities(){const root=el("priorityRows"),max=Math.max(...MODEL.priorities.map((row)=>row.count),1);root.replaceChildren();MODEL.priorities.forEach((row)=>{const line=make("div","priority-row"),track=make("div","bar-track"),button=make("button","bar-btn");button.type="button";button.style.width=row.count/max*100+"%";button.disabled=row.count===0;button.setAttribute("aria-label",row.priority+" 当前遗留 "+row.count+" 条");button.addEventListener("click",()=>openDetail({priority:row.priority},row.priority,"当前未完成 Bug"));track.append(button);const metric=make("span","metric"),strong=make("b",null,row.count+" 条");metric.append(strong,document.createTextNode(" · "+row.share+"%"));line.append(make("div","priority-name",row.priority),track,metric);root.append(line)})}

function renderShares(){const root=el("shareRows");root.replaceChildren();MODEL.modules.forEach((row)=>{const button=make("button","share-row"),track=make("span","share-track"),fill=make("span","share-fill");button.type="button";button.setAttribute("aria-label",row.module+" 当前遗留 "+row.count+" 条，占比 "+row.share+"%");fill.style.width=Math.max(row.share,1)+"%";track.append(fill);button.append(make("span","module-name",row.module),track,make("span","share-value",row.count+" 条 · "+row.share+"%"));button.addEventListener("click",()=>openDetail({module:row.module},row.module+" · 当前遗留","占当前全部未完成 Bug 的 "+row.share+"%"));root.append(button)})}

el("totalButton").addEventListener("click",()=>showDetail(MODEL.issues,"当前遗留","全部未完成 Bug"));
el("detailClose").addEventListener("click",closeDetail);el("detail").addEventListener("click",(event)=>{if(event.target===el("detail"))closeDetail()});document.addEventListener("keydown",(event)=>{if(event.key==="Escape")closeDetail()});
renderStatuses();renderPriorities();renderShares();
</script>
</body>
</html>
