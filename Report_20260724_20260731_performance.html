<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;

  --s1: #898781;
  --s2: #2a78d6;
  --s3: #eda100;
  --s4: #4a3aa7;
  --s5: #008300;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #a5a39d;
    --grid: #2c2c2a;
    --baseline: #4a4a46;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-wash: rgba(57, 135, 229, 0.16);
    --risk: #e66767;
    --s1: #a5a39d;
    --s2: #3987e5;
    --s3: #d69a20;
    --s4: #9085e9;
    --s5: #25a65a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
.wrap {
  width: min(100%, 1100px);
  margin: 0 auto;
  padding: 32px 24px 56px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
h1 { margin: 0 0 3px; font-size: 25px; font-weight: 650; letter-spacing: -0.02em; }
.sub { color: var(--muted); }
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.tile, .card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.tile {
  position: relative;
  width: 100%;
  overflow: hidden;
  padding: 16px 18px;
  appearance: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color 120ms ease, background-color 120ms ease, transform 120ms ease;
}
.tile::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--tile-color);
  content: "";
}
.tile:nth-child(1) { --tile-color: var(--s2); }
.tile:nth-child(2) { --tile-color: var(--s5); }
.tile:nth-child(3) { --tile-color: var(--s3); }
.tile:hover { border-color: var(--tile-color); transform: translateY(-1px); }
.tile[aria-pressed="true"] {
  border-color: var(--tile-color);
  background: color-mix(in srgb, var(--tile-color) 7%, var(--surface));
}
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.label { margin-bottom: 6px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; }
.value { font-size: 38px; font-weight: 650; line-height: 1.08; font-variant-numeric: tabular-nums; }
.unit { margin-left: 5px; color: var(--muted); font-size: 15px; font-weight: 600; }
.sample { margin-top: 7px; color: var(--muted); font-size: 13px; }
.card { padding: 20px 24px; }
.stage-detail {
  --detail-color: var(--s2);
  position: relative;
  overflow: hidden;
}
.stage-detail::before {
  position: absolute;
  inset: 0 0 auto;
  height: 3px;
  background: var(--detail-color);
  content: "";
}
.stage-detail-body { margin-top: 16px; }
.stage-detail.has-media .stage-detail-body {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(360px, 1.2fr);
  gap: 24px;
  align-items: start;
}
.stage-description { margin: 0; color: var(--ink-2); font-size: 15px; }
.stage-notes { display: grid; gap: 8px; margin-top: 16px; }
.stage-note {
  margin: 0;
  padding: 10px 12px;
  border-left: 3px solid var(--detail-color);
  border-radius: 0 7px 7px 0;
  background: var(--accent-wash);
  color: var(--ink-2);
  font-size: 14px;
}
.stage-note strong { display: block; margin-bottom: 2px; color: var(--ink); font-size: 12px; }
.stage-media { display: grid; gap: 12px; }
.stage-media[hidden] { display: none; }
.stage-media figure { margin: 0; }
.stage-image {
  display: block;
  width: 100%;
  max-height: 440px;
  object-fit: contain;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--page);
}
.stage-media figcaption { margin-top: 7px; color: var(--muted); font-size: 13px; }
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
h2 { margin: 0; font-size: 18px; font-weight: 650; }
.sub { margin-top: 2px; font-size: 14px; }
.legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chart-legend { justify-content: flex-end; margin-bottom: 14px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; }
.chart-scroll { width: 100%; overflow-x: auto; }
#fps-chart { display: block; width: 100%; height: auto; min-width: 680px; }
.axis-label { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.band-label { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.tip {
  position: fixed;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
  color: var(--ink);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  transition: opacity 80ms ease;
}
#fps-chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
@media (max-width: 560px) {
  .wrap { padding: 24px 16px 40px; }

  .card { padding: 18px 16px; }
  #fps-chart { min-width: 620px; }
  .legend { gap: 8px 12px; }
  .stage-detail.has-media .stage-detail-body { display: block; }
  .stage-media { margin-top: 18px; }
}
</style>

<script>
"use strict";
const REPORT = JSON.parse(document.getElementById("report-data").textContent);
const STAGES = JSON.parse(document.getElementById("stage-data").textContent);
const sourcePoints = REPORT.points;
let compressedTime = 0;
const compressedPoints = [];
for (const band of REPORT.bands) {
  const sourceStart = band.start;
  const sourceEnd = band.end;
  const duration = sourceEnd - sourceStart;
  for (const point of sourcePoints) {
    if (point[0] >= sourceStart && point[0] <= sourceEnd) {
      compressedPoints.push([compressedTime + point[0] - sourceStart, point[1]]);
    }
  }
  band.start = compressedTime;
  band.end = compressedTime + duration;
  compressedTime = band.end;
}
REPORT.points = compressedPoints;
REPORT.span = compressedTime;
const NS = "http://www.w3.org/2000/svg";
const byId = id => document.getElementById(id);
const make = (name, attrs = {}, text = "") => {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text) node.textContent = text;
  return node;
};

document.title = REPORT.title;
byId("title").textContent = REPORT.title;

const stageTabs = [];
const stageColors = Object.fromEntries(REPORT.bands.map(band => [band.label, band.color]));

function showStage(label) {
  const detail = STAGES[label];
  if (!detail) return;
  for (const tab of stageTabs) {
    tab.setAttribute("aria-pressed", String(tab.dataset.stage === label));
  }
  const panel = byId("stage-detail");
  panel.style.setProperty("--detail-color", `var(--${stageColors[label] || "s2"})`);
  byId("stage-detail-title").textContent = label;
  byId("stage-description").textContent = detail.description;

  const notes = byId("stage-notes");
  notes.replaceChildren();
  for (const noteText of detail.notes) {
    const note = document.createElement("p");
    note.className = "stage-note";
    const noteLabel = document.createElement("strong");
    noteLabel.textContent = "备注";
    note.append(noteLabel, document.createTextNode(noteText));
    notes.append(note);
  }

  const media = byId("stage-media");
  media.replaceChildren();
  for (const image of detail.images) {
    const figure = document.createElement("figure");
    const img = document.createElement("img");
    img.className = "stage-image";
    img.src = image.src;
    img.alt = image.alt;
    img.loading = "lazy";
    const caption = document.createElement("figcaption");
    caption.textContent = image.caption;
    figure.append(img, caption);
    media.append(figure);
  }
  const hasMedia = detail.images.length > 0;
  media.hidden = !hasMedia;
  panel.classList.toggle("has-media", hasMedia);
}

for (const item of REPORT.averages) {
  const tile = document.createElement("button");
  tile.type = "button";
  tile.className = "tile";
  tile.dataset.stage = item.label;
  tile.setAttribute("aria-controls", "stage-detail");
  tile.setAttribute("aria-pressed", "false");
  tile.setAttribute("aria-label", `${item.label}，平均 ${item.value.toFixed(1)} FPS，查看阶段说明`);
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = item.label;
  const value = document.createElement("div");
  value.className = "value";
  value.append(document.createTextNode(item.value.toFixed(1)));
  const unit = document.createElement("span");
  unit.className = "unit";
  unit.textContent = "FPS";
  value.append(unit);
  const sample = document.createElement("div");
  sample.className = "sample";
  sample.textContent = item.label === "ENTER_SCENE" ? "统计时间 70.9s" : "统计时间 100s";
  tile.append(label, value, sample);
  tile.addEventListener("click", () => showStage(item.label));
  tile.addEventListener("keydown", event => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    const direction = event.key === "ArrowRight" ? 1 : -1;
    const index = stageTabs.indexOf(tile);
    const next = stageTabs[(index + direction + stageTabs.length) % stageTabs.length];
    next.focus();
    showStage(next.dataset.stage);
  });
  stageTabs.push(tile);
  byId("averages").append(tile);
}
showStage(REPORT.averages[0].label);

const lineLegend = document.createElement("span");
lineLegend.className = "legend-item";
const lineSwatch = document.createElement("span");
lineSwatch.className = "swatch";
lineSwatch.style.background = "var(--accent)";
lineLegend.append(lineSwatch, document.createTextNode("FPS"));
byId("legend").append(lineLegend);
for (const band of REPORT.bands) {
  const item = document.createElement("span");
  item.className = "legend-item";
  const swatch = document.createElement("span");
  swatch.className = "swatch";
  swatch.style.background = `var(--${band.color})`;
  item.append(swatch, document.createTextNode(band.label));
  byId("legend").append(item);
}

const svg = byId("fps-chart");
const W = 1000;
const H = 390;
const margin = {left: 54, right: 18, top: 34, bottom: 42};
const plotW = W - margin.left - margin.right;
const plotH = H - margin.top - margin.bottom;
const yMax = Math.max(90, Math.ceil(Math.max(...REPORT.points.map(point => point[1])) / 10) * 10);
const xOf = value => margin.left + (value / REPORT.span) * plotW;
const yOf = value => margin.top + (1 - Math.min(value, yMax) / yMax) * plotH;

const defs = make("defs");
const gradient = make("linearGradient", {id: "area-fill", x1: "0", y1: "0", x2: "0", y2: "1"});
gradient.append(
  make("stop", {offset: "0", "stop-color": "var(--accent)", "stop-opacity": "0.24"}),
  make("stop", {offset: "1", "stop-color": "var(--accent)", "stop-opacity": "0.02"})
);
const clip = make("clipPath", {id: "plot-clip"});
clip.append(make("rect", {x: margin.left, y: margin.top, width: plotW, height: plotH}));
defs.append(gradient, clip);
svg.append(defs);

const plot = make("g", {"clip-path": "url(#plot-clip)"});
for (const band of REPORT.bands) {
  const x = xOf(band.start);
  const width = Math.max(0, xOf(band.end) - x);
  plot.append(make("rect", {
    x, y: margin.top, width, height: plotH,
    fill: `var(--${band.color})`, opacity: "0.075"
  }));
  if (band.start > 0) {
    plot.append(make("line", {
      x1: x, y1: margin.top, x2: x, y2: H - margin.bottom,
      stroke: "var(--baseline)", "stroke-width": "1", "stroke-dasharray": "4 4"
    }));
  }
}
svg.append(plot);

for (let fps = 0; fps <= yMax; fps += 30) {
  const y = yOf(fps);
  svg.append(make("line", {
    x1: margin.left, y1: y, x2: W - margin.right, y2: y,
    stroke: fps === 0 ? "var(--baseline)" : "var(--grid)", "stroke-width": "1",
    "stroke-dasharray": fps === 30 || fps === 60 ? "5 5" : "0"
  }));
  svg.append(make("text", {x: margin.left - 9, y: y + 4, "text-anchor": "end", class: "axis-label"}, `${fps}`));
}

const tickStep = REPORT.span <= 180 ? 30 : 60;
for (let second = 0; second <= REPORT.span; second += tickStep) {
  const x = xOf(second);
  svg.append(make("line", {x1: x, y1: H - margin.bottom, x2: x, y2: H - margin.bottom + 5, stroke: "var(--baseline)"}));
  svg.append(make("text", {x, y: H - 15, "text-anchor": "middle", class: "axis-label"}, `${second}s`));
}

for (const band of REPORT.bands) {
  const center = (xOf(band.start) + xOf(band.end)) / 2;
  svg.append(make("text", {x: center, y: 22, "text-anchor": "middle", class: "band-label"}, band.label));
}

const linePoints = REPORT.points.map(point => `${xOf(point[0]).toFixed(2)},${yOf(point[1]).toFixed(2)}`);
const areaPoints = [
  `${xOf(REPORT.points[0][0]).toFixed(2)},${(H - margin.bottom).toFixed(2)}`,
  ...linePoints,
  `${xOf(REPORT.points.at(-1)[0]).toFixed(2)},${(H - margin.bottom).toFixed(2)}`
].join(" ");
plot.append(make("polygon", {points: areaPoints, fill: "url(#area-fill)"}));
plot.append(make("polyline", {
  points: linePoints.join(" "), fill: "none", stroke: "var(--accent)",
  "stroke-width": "1.65", "stroke-linejoin": "round", "stroke-linecap": "round"
}));

const cross = make("line", {
  y1: margin.top, y2: H - margin.bottom, stroke: "var(--ink-2)",
  "stroke-width": "1", "stroke-dasharray": "3 3", opacity: "0"
});
const dot = make("circle", {r: "4", fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": "2", opacity: "0"});
const hit = make("rect", {x: margin.left, y: margin.top, width: plotW, height: plotH, fill: "transparent"});
svg.append(cross, dot, hit);

const tip = byId("tip");
const hideTip = () => {
  cross.setAttribute("opacity", "0");
  dot.setAttribute("opacity", "0");
  tip.style.opacity = "0";
};
hit.addEventListener("pointermove", event => {
  const bounds = svg.getBoundingClientRect();
  const localX = (event.clientX - bounds.left) / bounds.width * W;
  const second = Math.max(0, Math.min(REPORT.span, (localX - margin.left) / plotW * REPORT.span));
  let nearest = REPORT.points[0];
  for (const point of REPORT.points) {
    if (Math.abs(point[0] - second) < Math.abs(nearest[0] - second)) nearest = point;
  }
  const x = xOf(nearest[0]);
  const y = yOf(nearest[1]);
  cross.setAttribute("x1", x);
  cross.setAttribute("x2", x);
  cross.setAttribute("opacity", "1");
  dot.setAttribute("cx", x);
  dot.setAttribute("cy", y);
  dot.setAttribute("opacity", "1");
  const activeBand = REPORT.bands.find(band => nearest[0] >= band.start && nearest[0] <= band.end);
  const localSecond = activeBand ? nearest[0] - activeBand.start : nearest[0];
  const prefix = activeBand ? `${activeBand.label} · ` : "";
  tip.textContent = `${prefix}${localSecond.toFixed(1)} 秒 · ${nearest[1].toFixed(1)} FPS`;
  tip.style.left = `${Math.min(event.clientX + 12, innerWidth - 165)}px`;
  tip.style.top = `${Math.max(8, event.clientY - 38)}px`;
  tip.style.opacity = "1";
});
hit.addEventListener("pointerleave", hideTip);
svg.addEventListener("blur", hideTip);
</script>
</body>
</html>
