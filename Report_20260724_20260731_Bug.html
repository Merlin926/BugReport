const el=(id)=>document.getElementById(id);
const make=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const periodName={last:"上周",current:"当前"};
const statusOrder={"待办":0,"进行中":1,"暂停":2,"评审中":3,"完成":4};
let detailReturnFocus=null;

function deltaClass(value){return value>0?"up":value<0?"down":"flat"}
function deltaText(value){return value>0?"增加 "+value+" 条":value<0?"减少 "+Math.abs(value)+" 条":"持平"}
function signed(value){return value>0?"+"+value:String(value)}

function renderOverview(){
  const root=el("overview"),s=MODEL.summary;root.replaceChildren();
  [{period:"current",label:"当前遗留",value:s.current},{period:"last",label:"上周遗留",value:s.last}].forEach((item)=>{
    const interactive=item.period==="current",card=make(interactive?"button":"div","overview-btn "+item.period+(interactive?"":" readonly"));
    if(interactive){card.type="button";card.setAttribute("aria-label",item.label+" "+item.value+" 条，点击查看明细")}
    card.append(make("span","overview-label",item.label));const value=make("span","overview-value",String(item.value));value.append(make("span","overview-unit","条"));card.append(value);
    if(interactive)card.addEventListener("click",()=>openDetail({period:item.period},item.label,"全部未完成 Bug"));root.append(card);
  });
  const delta=make("div","delta-card"),kind=deltaClass(s.delta);delta.append(make("span","delta-label","较上周"),make("span","delta-value "+kind,signed(s.delta)+" 条"),make("span","delta-note",s.delta>0?"遗留增加":s.delta<0?"遗留减少":"遗留持平"));root.append(delta);
}

function detailButton(className,width,period,filters,label){
  const interactive=period==="current",mark=make(interactive?"button":"span",className+(interactive?"":" readonly"));mark.style.width=width+"%";
  if(!interactive)return mark;
  mark.type="button";mark.disabled=width===0;mark.setAttribute("aria-label",label);mark.addEventListener("click",()=>openDetail({...filters,period},label,periodName[period]+"未完成 Bug"));return mark;
}

function renderPriorities(){
  const root=el("priorityRows"),max=Math.max(...MODEL.priorities.flatMap((row)=>[row.last,row.current]),1);root.replaceChildren();
  MODEL.priorities.forEach((row)=>{
    const line=make("div","priority-row"),bars=make("div","pair-bars");
    [["last",row.last],["current",row.current]].forEach(([period,count])=>{const barLine=make("div","bar-line"),track=make("div","bar-track");track.append(detailButton("bar-btn "+period,count/max*100,period,{priority:row.priority},row.priority+" · "+periodName[period]+" "+count+" 条"));barLine.append(make("span","bar-period",periodName[period]),track,make("span","bar-count",String(count)));bars.append(barLine)});
    line.append(make("div","priority-name",row.priority),bars,make("span","change "+deltaClass(row.delta),deltaText(row.delta)));root.append(line);
  });
}

function renderModules(){
  const root=el("moduleRows"),rows=[...MODEL.modules].sort((a,b)=>b.delta-a.delta||b.current-a.current||a.module.localeCompare(b.module,"zh-CN")),max=Math.max(...rows.flatMap((row)=>[row.last,row.current]),1);root.replaceChildren();
  rows.forEach((row)=>{const line=make("div","module-row"),bars=make("div","module-bars");
    [["last",row.last],["current",row.current]].forEach(([period,count])=>{const mini=make("div","mini-line"),track=make("div","mini-track");track.append(detailButton("mini-btn "+period,count/max*100,period,{module:row.module},row.module+" · "+periodName[period]+" "+count+" 条"));mini.append(make("span","mini-label",periodName[period]),track,make("span","mini-count",String(count)));bars.append(mini)});
    line.append(make("div","module-name",row.module),bars,make("span","change "+deltaClass(row.delta),deltaText(row.delta)),make("span","module-share",row.current+" 条 · "+row.share+"%"));root.append(line);
  });
}

function renderShares(){
  const root=el("shareRows");root.replaceChildren();
  MODEL.modules.filter((row)=>row.current>0).sort((a,b)=>b.current-a.current||a.module.localeCompare(b.module,"zh-CN")).forEach((row)=>{const button=make("button","share-row"),track=make("span","share-track"),fill=make("span","share-fill");button.type="button";button.setAttribute("aria-label",row.module+" 当前遗留 "+row.current+" 条，占比 "+row.share+"%");fill.style.width=Math.max(row.share,1)+"%";track.append(fill);button.append(make("span","module-name",row.module),track,make("span","share-value",row.current+" 条 · "+row.share+"%"));button.addEventListener("click",()=>openDetail({period:"current",module:row.module},row.module+" · 当前遗留","占当前全部未完成 Bug 的 "+row.share+"%"));root.append(button)});
}

function matchingIssues(filters){return MODEL.issues.filter((issue)=>Object.entries(filters).every(([key,value])=>issue[key]===value)).sort((a,b)=>(statusOrder[a.status]??9)-(statusOrder[b.status]??9)||a.priority.localeCompare(b.priority)||a.key.localeCompare(b.key))}
function openDetail(filters,title,subtitle){showDetail(matchingIssues(filters),title,subtitle)}
function showDetail(rows,title,subtitle){
  el("detailTitle").textContent=title+"（"+rows.length+" 条）";el("detailSub").textContent=subtitle;const list=el("detailList");list.replaceChildren();if(!rows.length)list.append(make("div","detail-empty","暂无 Bug"));
  const groups=[...new Set(rows.map((issue)=>issue.module))].map((module)=>({module,issues:rows.filter((issue)=>issue.module===module)})).sort((a,b)=>b.issues.length-a.issues.length||a.module.localeCompare(b.module,"zh-CN"));
  groups.forEach((entry)=>{const group=make("section","detail-group"),head=make("div","detail-group-head"),body=make("div","detail-group-rows");head.append(make("span","detail-group-name",entry.module),make("span","detail-group-count",entry.issues.length+" 条"));entry.issues.forEach((issue)=>{const row=make("div","detail-row");row.append(make("span","detail-key",issue.key),make("span","detail-priority",issue.priority),make("span","detail-status",issue.status),make("span","detail-assignee",issue.assignee),make("span","detail-date",issue.createdAt),make("span","detail-summary",issue.summary));body.append(row)});group.append(head,body);list.append(group)});
  detailReturnFocus=document.activeElement;el("detail").hidden=false;document.body.classList.add("detail-open");el("detailClose").focus({preventScroll:true});
}
function closeDetail(){const detail=el("detail");if(detail.hidden)return;detail.hidden=true;document.body.classList.remove("detail-open");if(detailReturnFocus&&document.contains(detailReturnFocus))detailReturnFocus.focus({preventScroll:true})}
el("detailClose").addEventListener("click",closeDetail);el("detail").addEventListener("click",(event)=>{if(event.target===el("detail"))closeDetail()});document.addEventListener("keydown",(event)=>{if(event.key==="Escape")closeDetail()});
renderOverview();renderPriorities();renderModules();renderShares();
</script>
</body>
</html>
